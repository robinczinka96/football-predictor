services:
  app:
    image: ${IMAGE:?Set IMAGE in .env.production}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    env_file:
      - .env.app
    environment:
      APP_DATA_DIR: /app/storage/cache
      MODEL_STORAGE_DIR: /app/storage/models
      STREAMLIT_SERVER_HEADLESS: "true"
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8501}:8501"
    volumes:
      - predictor-cache:/app/storage/cache
      - predictor-models:/app/storage/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  predictor-cache:
  predictor-models:
